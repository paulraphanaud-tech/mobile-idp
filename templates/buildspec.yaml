version: 0.2

env:
  variables:
    FASTLANE_ENV: "dev"
    ANDROID_HOME: "/usr/local/android-sdk-manual"
    ANDROID_SDK_ROOT: "/usr/local/android-sdk-manual"
    S3_BUCKET_NAME: "{{PROJECT_NAME}}-keystores"
  # No `secrets-manager:` block here on purpose. That section is a static
  # mapping with no variable expansion, so it cannot name an environment-
  # specific path like "staging/fastlane/credentials" — and one repo has one
  # buildspec but several environments. The CodeBuild *project* injects every
  # secret instead (see `secrets_manager_variables` in infra/main.tf), which
  # keeps the paths env-aware and keeps one source of truth.
  #
  # Project-level environment variables also override the `variables:` block
  # here, so FASTLANE_ENV and the bucket names above are defaults for a
  # manual run, not what CI actually uses.

phases:
  install:
    runtime-versions:
      java: corretto17
    commands:
      - gem install bundler
      - bundle install
      - |
        if [ ! -d "$ANDROID_HOME" ]; then
          mkdir -p "$ANDROID_HOME"
          (
            cd /tmp
            curl -sSo cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -qo cmdline-tools.zip
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            mv cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          )
        fi
      - yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - |
        if ! command -v flutter &>/dev/null; then
          git clone https://github.com/flutter/flutter.git -b stable /opt/flutter
          export PATH="/opt/flutter/bin:$PATH"
          flutter precache
        fi
      - export PATH="/opt/flutter/bin:$PATH"

  pre_build:
    commands:
      - export PATH="/opt/flutter/bin:$PATH"
      - flutter --version
      - |
        echo "Downloading keystore from S3..."
        mkdir -p android/app/keystore
        aws s3 cp "s3://${S3_BUCKET_NAME}/keystore/release-key.jks" android/app/keystore/release-key.jks || echo "No keystore found — skipping"

  build:
    commands:
      - export PATH="/opt/flutter/bin:$PATH"
      - bundle exec fastlane android build_deploy

  post_build:
    commands:
      - echo "Build completed on $(date)"
      - rm -f android/app/keystore/release-key.jks

artifacts:
  files:
    - build/app/outputs/flutter-apk/app-*-release.apk
  discard-paths: yes

cache:
  paths:
    - vendor/bundle/**/*
    - /opt/flutter/**/*
