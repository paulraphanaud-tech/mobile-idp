version: 0.2

env:
  variables:
    FASTLANE_ENV: "dev"
    ANDROID_HOME: "/usr/local/android-sdk-manual"
    ANDROID_SDK_ROOT: "/usr/local/android-sdk-manual"
    S3_BUCKET_NAME: "{{PROJECT_NAME}}-keystores"
    # --- Supply chain (SBOM + dependency CVE scan) -------------------------
    # SC_FAIL_ON is the severity at or above which a finding fails the build:
    # none (default) | low | moderate | high | critical | any. It starts at
    # `none` on purpose — a template that fails other teams' builds on day one
    # over an untriaged transitive advisory gets disabled outright. Raise it
    # once your baseline is clean. Pin SYFT_VERSION / OSV_SCANNER_VERSION for
    # reproducible tooling; empty means latest.
    SC_ENABLED: "true"
    SC_FAIL_ON: "none"
    SYFT_VERSION: ""
    OSV_SCANNER_VERSION: ""
  # No `secrets-manager:` block here on purpose. That section is a static
  # mapping with no variable expansion, so it cannot name an environment-
  # specific path like "staging/fastlane/credentials" — and one repo has one
  # buildspec but several environments. The CodeBuild *project* injects every
  # secret instead (see `secrets_manager_variables` in infra/main.tf), which
  # keeps the paths env-aware and keeps one source of truth.
  #
  # Project-level environment variables also override the `variables:` block
  # here, so FASTLANE_ENV and the bucket names above are defaults for a
  # manual run, not what CI actually uses.

phases:
  install:
    runtime-versions:
      java: corretto17
    commands:
      - bash scripts/build-metrics.sh start
      - gem install bundler
      - bundle install
      - |
        if [ ! -d "$ANDROID_HOME" ]; then
          mkdir -p "$ANDROID_HOME"
          (
            cd /tmp
            curl -sSo cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -qo cmdline-tools.zip
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            mv cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          )
        fi
      - yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - |
        if ! command -v flutter &>/dev/null; then
          git clone https://github.com/flutter/flutter.git -b stable /opt/flutter
          export PATH="/opt/flutter/bin:$PATH"
          flutter precache
        fi
      - export PATH="/opt/flutter/bin:$PATH"
      - bash scripts/supply-chain.sh install

  pre_build:
    commands:
      - export PATH="/opt/flutter/bin:$PATH"
      - flutter --version
      # Registry guards, before anything expensive.
      #
      # validate catches a misspelled rule condition that would silently target
      # everyone, a GA4-reserved event name that would never be recorded, and a
      # colour token that breaks the ColorScheme.
      #
      # codegen-check fails when a registry was edited without regenerating.
      # Without it the build compiles the *old* generated code and everything
      # passes, which is the failure mode that wastes an afternoon.
      - bash scripts/codegen.sh validate
      - bash scripts/codegen.sh check
      - |
        echo "Downloading keystore from S3..."
        mkdir -p android/app/keystore
        aws s3 cp "s3://${S3_BUCKET_NAME}/keystore/release-key.jks" android/app/keystore/release-key.jks || echo "No keystore found — skipping"

  build:
    commands:
      - export PATH="/opt/flutter/bin:$PATH"
      # Resolve dependencies before the SBOM step so pubspec.lock and the
      # Gradle caches exist for syft to read.
      - flutter pub get
      - bash scripts/supply-chain.sh sbom android
      # Runs before the build: a dependency with a critical advisory should
      # stop the build, not be discovered after an APK has been produced.
      - bash scripts/supply-chain.sh scan android
      - bundle exec fastlane android build_deploy

  post_build:
    commands:
      - echo "Build completed on $(date)"
      # Uploaded even when the build failed, so a scan-triggered failure still
      # leaves the report that explains it.
      - bash scripts/supply-chain.sh upload android
      - rm -f android/app/keystore/release-key.jks

      - bash scripts/build-metrics.sh finish android
artifacts:
  files:
    - build/app/outputs/flutter-apk/app-*-release.apk
    - build/supply-chain/*
  discard-paths: yes

cache:
  paths:
    - vendor/bundle/**/*
    - /opt/flutter/**/*
