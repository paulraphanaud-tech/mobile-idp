# Generated by mobile-idp scripts/generate-github-actions.sh — regenerate rather than hand-edit.
#
# Build + unit tests on an iOS simulator, on every push to any branch.
# Needs no secrets, no Apple account and no signing, so it works the moment
# the repo is pushed.
#
# Only `push` (not also `pull_request`): a PR's head commit is already pushed,
# so listening to both would run every PR twice — and macOS minutes count 10x
# against a private repo's free quota.
name: iOS CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["**/*.md", "docs/**", "tools/**", ".idp.env"]
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build & test (simulator)
    runs-on: @@RUNNER@@
    timeout-minutes: @@TIMEOUT@@
    steps:
      - uses: actions/checkout@@@CHECKOUT_VERSION@@

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: @@XCODE_VERSION@@

      # Newest iOS runtime's first iPhone, so the workflow survives runner
      # image updates that drop a hard-coded device name.
      - name: Pick a simulator
        id: sim
        run: |
          xcrun simctl list devices available -j | python3 -c '
          import json, sys
          best = None
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              if "iOS" not in runtime:
                  continue
              version = tuple(int(p) for p in runtime.rsplit("iOS-", 1)[1].split("-") if p.isdigit())
              for d in devices:
                  if d["name"].startswith("iPhone") and (best is None or version > best[0]):
                      best = (version, d["udid"], d["name"])
          if best is None:
              sys.exit("No available iPhone simulator")
          print("udid=%s" % best[1])
          print("name=%s (iOS %s)" % (best[2], ".".join(map(str, best[0]))))
          ' >> "$GITHUB_OUTPUT"

      - name: "@@ACTION_TITLE@@ on ${{ steps.sim.outputs.name }}"
        run: |
          set -o pipefail
          xcodebuild @@XCODEBUILD_ACTION@@ \
            @@CONTAINER_FLAG@@ \
            -scheme "@@SCHEME@@" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/Results.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | if command -v xcbeautify >/dev/null; then xcbeautify --renderer github-actions; else cat; fi

      - name: Test summary
        if: always()
        run: |
          {
            echo "## @@SCHEME@@ — ${{ steps.sim.outputs.name }}"
            if [ -d build/Results.xcresult ]; then
              xcrun xcresulttool get test-results summary --path build/Results.xcresult 2>/dev/null | python3 -c '
          import json, sys
          try:
              s = json.load(sys.stdin)
          except Exception:
              sys.exit(0)
          print("**%s** — passed %s, failed %s, skipped %s" % (
              s.get("result", "?"), s.get("passedTests", 0), s.get("failedTests", 0), s.get("skippedTests", 0)))
          for f in s.get("testFailures", [])[:20]:
              print("- ❌ %s: %s" % (f.get("testName", "?"), f.get("failureText", "")))
          ' || true
            else
              echo "No result bundle (the build failed before tests ran — see the step log)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload result bundle
        if: failure()
        uses: actions/upload-artifact@@@UPLOAD_ARTIFACT_VERSION@@
        with:
          name: xcresult-${{ github.run_number }}
          path: build/Results.xcresult
          retention-days: 7
