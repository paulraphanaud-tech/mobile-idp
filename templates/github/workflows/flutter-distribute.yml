# Generated by mobile-idp scripts/generate-github-actions.sh — regenerate rather than hand-edit.
#
# Signed test builds sent to testers' phones, started by hand (Actions tab →
# "Distribute to testers" → Run workflow, or the API):
#
#   Android → Firebase App Distribution (Linux runner)
#   iOS     → TestFlight (internal testers) or Firebase App Distribution
#             (ad-hoc; the tester's device must be registered — see
#             signing-setup.yml) (macOS runner)
#
# Tier 2 in the IDP's blast-radius table: each run consumes a build number.
#
# Credentials: GitHub *environment* secrets (Settings → Environments → <env>),
# no AWS account needed. If the environment has an AWS_ROLE_ARN variable, the
# iOS job reads the IDP's Secrets Manager entry through OIDC instead.
# Full list and where each value comes from: docs/github-distribution.md in
# mobile-idp. Run signing-setup.yml once before the first distribution.
name: Distribute to testers

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment holding the secrets (and fastlane/env.<env>)
        type: choice
        options: [dev, staging, prod]
        default: dev
      android:
        description: Android
        type: choice
        options: [firebase, none]
        default: firebase
      ios:
        description: iOS
        type: choice
        options: [testflight, firebase, none]
        default: testflight
      bump:
        description: Version segment to bump
        type: choice
        options: [patch, minor, major]
        default: patch
      release_notes:
        description: What testers should look at (optional)
        type: string
        default: ""

concurrency:
  group: distribute-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  FASTLANE_ENV: ${{ inputs.environment }}
  FASTLANE_SKIP_UPDATE_CHECK: "1"
  FASTLANE_HIDE_CHANGELOG: "1"
  RELEASE_NOTES: ${{ inputs.release_notes != '' && inputs.release_notes || format('{0} @ {1}', github.ref_name, github.sha) }}

jobs:
  android:
    name: Android → Firebase (${{ inputs.environment }})
    if: inputs.android == 'firebase'
    runs-on: ubuntu-latest
    timeout-minutes: @@DEPLOY_TIMEOUT@@
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: @@APP_DIR@@
    steps:
      - uses: actions/checkout@@@CHECKOUT_VERSION@@
        with:
          submodules: recursive

      - name: Fetch IDP modules
        uses: actions/checkout@@@CHECKOUT_VERSION@@
        with:
          repository: @@IDP_REPO@@
          ref: @@IDP_REF@@
          path: @@APP_PREFIX@@.idp

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install gems
        run: bash .idp/scripts/ci-bundle.sh

      - name: Generate android/ if missing
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            echo "::notice::No android/ project; generating one for this build (package @@ORG@@.<pubspec name>)."
            flutter create --platforms=android --org @@ORG@@ .
          fi

      - name: Credentials
        env:
          GH_MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          GH_SIGNING_REPO: ${{ vars.SIGNING_REPO }}
          GH_SIGNING_REPO_TOKEN: ${{ secrets.SIGNING_REPO_TOKEN }}
          GH_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GH_FIREBASE_CLI_TOKEN: ${{ secrets.FIREBASE_CLI_TOKEN }}
          GITHUB_ENVIRONMENT_NAME: ${{ inputs.environment }}
        run: bash .idp/scripts/ci-credentials.sh signing,firebase

      # The same key every build, so testers can install over the previous one.
      - name: Android signing key
        env:
          KEY_ID: @@SIGNING_KEY_ID@@
        run: bash .idp/scripts/android-signing.sh fetch

      - name: Build & upload
        run: bundle exec fastlane android deploy_firebase bump:${{ inputs.bump }}

  ios:
    name: iOS → ${{ inputs.ios }} (${{ inputs.environment }})
    if: inputs.ios != 'none'
    runs-on: @@RUNNER@@
    timeout-minutes: @@DEPLOY_TIMEOUT@@
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: @@APP_DIR@@
    steps:
      - uses: actions/checkout@@@CHECKOUT_VERSION@@
        with:
          submodules: recursive

      - name: Fetch IDP modules
        uses: actions/checkout@@@CHECKOUT_VERSION@@
        with:
          repository: @@IDP_REPO@@
          ref: @@IDP_REF@@
          path: @@APP_PREFIX@@.idp

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: @@XCODE_VERSION@@

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install gems
        run: bash .idp/scripts/ci-bundle.sh

      - name: Generate ios/ if missing
        run: |
          if [ ! -d ios/Runner.xcodeproj ]; then
            echo "::notice::No ios/Runner.xcodeproj; generating the iOS project for this build."
            flutter create --platforms=ios --org @@ORG@@ .
          fi

      - name: AWS credentials (OIDC)
        if: vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@@@AWS_CREDENTIALS_VERSION@@
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: @@AWS_REGION@@

      - name: Read fastlane credentials from Secrets Manager
        if: vars.AWS_ROLE_ARN != ''
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            IDPCREDS,${{ inputs.environment }}/fastlane/credentials
          parse-json-secrets: true

      - name: Credentials
        env:
          GH_MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          GH_SIGNING_REPO: ${{ vars.SIGNING_REPO }}
          GH_SIGNING_REPO_TOKEN: ${{ secrets.SIGNING_REPO_TOKEN }}
          GH_ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          GH_ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          GH_ASC_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          GH_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GH_FIREBASE_CLI_TOKEN: ${{ secrets.FIREBASE_CLI_TOKEN }}
          GITHUB_ENVIRONMENT_NAME: ${{ inputs.environment }}
        run: bash .idp/scripts/ci-credentials.sh ios${{ inputs.ios == 'firebase' && ',firebase' || '' }}

      - name: Temporary keychain
        run: bash .idp/scripts/ci-keychain.sh

      - name: Build & upload
        env:
          # GitHub runners start with no certificates: fetch them, read-only.
          IDP_SYNC_SIGNING: "true"
        run: bundle exec fastlane ios deploy_${{ inputs.ios }} bump:${{ inputs.bump }}

      - name: Summary
        if: success()
        run: |
          if [ "${{ inputs.ios }}" = testflight ]; then
            echo "Uploaded to TestFlight. Internal testers get it in the TestFlight app once Apple finishes processing (usually 5–15 min)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Uploaded to Firebase App Distribution. Testers get an email / the App Tester app shows the new build." >> "$GITHUB_STEP_SUMMARY"
          fi
