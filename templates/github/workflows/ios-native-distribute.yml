# Generated by mobile-idp scripts/generate-github-actions.sh — regenerate rather than hand-edit.
#
# Signed iOS test build sent to testers, started by hand (Actions tab →
# "Distribute to testers" → Run workflow, or the API):
#
#   testflight  App Store build → TestFlight, internal testers. No device
#               registration; install from the TestFlight app.
#   firebase    ad-hoc build → Firebase App Distribution. Each tester's iPhone
#               must be registered first (signing-setup.yml, ios_devices).
#
# Tier 2 in the IDP's blast-radius table: each run consumes a build number.
#
# Credentials: GitHub *environment* secrets (Settings → Environments → <env>),
# no AWS account needed — see docs/github-distribution.md in mobile-idp. If the
# environment has an AWS_ROLE_ARN variable, they are read from the IDP's
# Secrets Manager entry through OIDC instead (docs/github-actions.md).
name: Distribute to testers

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment holding the secrets (and fastlane/env.<env>)
        type: choice
        options: [dev, staging, prod]
        default: dev
      destination:
        description: Where testers install from
        type: choice
        options: [testflight, firebase]
        default: testflight
      bump:
        description: Version segment to bump
        type: choice
        options: [patch, minor, major]
        default: patch
      release_notes:
        description: What testers should look at (optional)
        type: string
        default: ""

concurrency:
  group: distribute-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: iOS → ${{ inputs.destination }} (${{ inputs.environment }})
    runs-on: @@RUNNER@@
    timeout-minutes: @@DEPLOY_TIMEOUT@@
    environment: ${{ inputs.environment }}
    env:
      FASTLANE_ENV: ${{ inputs.environment }}
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
      RELEASE_NOTES: ${{ inputs.release_notes != '' && inputs.release_notes || format('{0} @ {1}', github.ref_name, github.sha) }}
    steps:
      - uses: actions/checkout@@@CHECKOUT_VERSION@@

      - name: Fetch IDP modules
        uses: actions/checkout@@@CHECKOUT_VERSION@@
        with:
          repository: @@IDP_REPO@@
          ref: @@IDP_REF@@
          path: .idp

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: @@XCODE_VERSION@@

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install gems
        run: bash .idp/scripts/ci-bundle.sh

      - name: AWS credentials (OIDC)
        if: vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@@@AWS_CREDENTIALS_VERSION@@
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: @@AWS_REGION@@

      # Exposes each JSON key as IDPCREDS_<KEY>, masked in logs.
      - name: Read fastlane credentials from Secrets Manager
        if: vars.AWS_ROLE_ARN != ''
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            IDPCREDS,${{ inputs.environment }}/fastlane/credentials
          parse-json-secrets: true

      - name: Credentials
        env:
          GH_MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          GH_SIGNING_REPO: ${{ vars.SIGNING_REPO }}
          GH_SIGNING_REPO_TOKEN: ${{ secrets.SIGNING_REPO_TOKEN }}
          GH_ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          GH_ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          GH_ASC_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          GH_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GH_FIREBASE_CLI_TOKEN: ${{ secrets.FIREBASE_CLI_TOKEN }}
          GITHUB_ENVIRONMENT_NAME: ${{ inputs.environment }}
        run: bash .idp/scripts/ci-credentials.sh ios${{ inputs.destination == 'firebase' && ',firebase' || '' }}

      - name: Temporary keychain
        run: bash .idp/scripts/ci-keychain.sh

      - name: Build & upload
        run: bundle exec fastlane ios deploy_${{ inputs.destination }} bump:${{ inputs.bump }}

      - name: Summary
        if: success()
        run: |
          if [ "${{ inputs.destination }}" = testflight ]; then
            echo "Uploaded to TestFlight. Internal testers get it in the TestFlight app once Apple finishes processing (usually 5–15 min)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Uploaded to Firebase App Distribution. Testers get an email / the App Tester web clip shows the new build." >> "$GITHUB_STEP_SUMMARY"
          fi
