# Generated by mobile-idp scripts/generate-github-actions.sh — regenerate rather than hand-edit.
#
# Signed build → TestFlight, started by hand (Actions tab, or the API).
# Tier 2 in the IDP's blast-radius table: the build number is consumed forever.
#
# No static credentials: the job assumes an AWS role through GitHub OIDC
# (modules/terraform/github_oidc), then reads the same Secrets Manager entry
# CodeBuild uses — <env>/fastlane/credentials — and match's S3 bucket.
#
# Setup (once):
#   - IDP infra: github_actions_repositories = ["@@GITHUB_REPO@@"] in tfvars,
#     `make infra-apply`, then `make infra-output` → github_actions_role_arn.
#   - Repo → Settings → Environments: create "dev" (and staging/prod as needed)
#     with a variable AWS_ROLE_ARN = that ARN. Add required reviewers on prod.
#   - fastlane/env.<environment> must exist for each environment you deploy.
name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      environment:
        description: IDP environment (selects Secrets Manager paths and fastlane/env.<env>)
        type: choice
        options: [dev, staging, prod]
        default: dev
      bump:
        description: Version segment to bump
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: ios-testflight
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: TestFlight (${{ inputs.environment }})
    runs-on: @@RUNNER@@
    timeout-minutes: @@DEPLOY_TIMEOUT@@
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@@@CHECKOUT_VERSION@@

      - name: Fetch IDP modules
        uses: actions/checkout@@@CHECKOUT_VERSION@@
        with:
          repository: @@IDP_REPO@@
          ref: @@IDP_REF@@
          path: .idp

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: @@XCODE_VERSION@@

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@@@AWS_CREDENTIALS_VERSION@@
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: @@AWS_REGION@@

      # Exposes each JSON key as IDPCREDS_<KEY>, masked in logs.
      - name: Read fastlane credentials from Secrets Manager
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            IDPCREDS,${{ inputs.environment }}/fastlane/credentials
          parse-json-secrets: true

      - name: Build & upload
        env:
          FASTLANE_ENV: ${{ inputs.environment }}
          MATCH_PASSWORD: ${{ env.IDPCREDS_MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ env.IDPCREDS_APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ env.IDPCREDS_APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ env.IDPCREDS_APP_STORE_CONNECT_KEY_CONTENT }}
          RELEASE_NOTES: "${{ github.ref_name }} @ ${{ github.sha }}"
        run: bundle exec fastlane ios deploy_testflight bump:${{ inputs.bump }}
