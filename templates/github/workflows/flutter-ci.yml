# Generated by mobile-idp scripts/generate-github-actions.sh — regenerate rather than hand-edit.
#
# Analyze + test on Linux (1x minute rate). Signed builds and store uploads
# stay on the IDP's CodeBuild pipeline; this is the fast feedback loop.
name: Flutter CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: @@TIMEOUT@@
    steps:
      - uses: actions/checkout@@@CHECKOUT_VERSION@@
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Same guard as the IDP buildspecs: fail when a registry was edited
      # without regenerating lib/generated/.
      - name: Registry codegen check
        if: hashFiles('scripts/codegen.sh') != ''
        run: bash scripts/codegen.sh validate && bash scripts/codegen.sh check

      - run: flutter analyze

      - run: flutter test --reporter github
