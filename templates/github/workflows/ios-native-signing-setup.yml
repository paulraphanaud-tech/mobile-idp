# Generated by mobile-idp scripts/generate-github-actions.sh — regenerate rather than hand-edit.
#
# One-time iOS signing setup, done on a GitHub macOS runner instead of a Mac:
# registers the bundle ID and tester devices on the Apple Developer account,
# then creates (or reuses) the distribution certificate and the App Store +
# ad-hoc profiles with Fastlane Match, stored encrypted in the private
# SIGNING_REPO.
#
# Tier 2: it creates Apple certificates and profiles. Run it once, and again
# only to add a tester's iPhone for Firebase (ad-hoc) builds — TestFlight needs
# no device registration. Builds never write; they sync read-only.
#
# Needs the GitHub environment's secrets (docs/github-distribution.md);
# SIGNING_REPO_TOKEN must have Contents: read *and write* on SIGNING_REPO.
name: Signing setup

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment holding the secrets (and fastlane/env.<env>)
        type: choice
        options: [dev, staging, prod]
        default: dev
      ios_devices:
        description: "iPhones for Firebase builds, name=UDID; name=UDID (optional)"
        type: string
        default: ""

concurrency:
  group: signing-setup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ios:
    name: iOS certificates & profiles
    runs-on: @@RUNNER@@
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    env:
      FASTLANE_ENV: ${{ inputs.environment }}
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
    steps:
      - uses: actions/checkout@@@CHECKOUT_VERSION@@

      - name: Fetch IDP modules
        uses: actions/checkout@@@CHECKOUT_VERSION@@
        with:
          repository: @@IDP_REPO@@
          ref: @@IDP_REF@@
          path: .idp

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install gems
        run: bash .idp/scripts/ci-bundle.sh

      - name: Credentials
        env:
          GH_MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          GH_SIGNING_REPO: ${{ vars.SIGNING_REPO }}
          GH_SIGNING_REPO_TOKEN: ${{ secrets.SIGNING_REPO_TOKEN }}
          GH_ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          GH_ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          GH_ASC_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          GITHUB_ENVIRONMENT_NAME: ${{ inputs.environment }}
        run: bash .idp/scripts/ci-credentials.sh ios

      - name: Temporary keychain
        run: bash .idp/scripts/ci-keychain.sh

      - name: Bundle ID, devices, certificates, profiles
        env:
          IOS_DEVICES: ${{ inputs.ios_devices }}
        run: bundle exec fastlane ios setup_signing types:appstore,adhoc devices:"$IOS_DEVICES"
