# Generated by mobile-idp scripts/generate-github-actions.sh — regenerate rather than hand-edit.
#
# Builds a debug Android APK on Linux (1x minute rate) and, if
# APPETIZE_API_TOKEN is set, uploads it to Appetize so the app runs in a web
# browser — desktop or phone — with no computer of your own. The APK is also
# attached to the run: download it on an Android phone and install it directly.
#
# Setup (once):
#   1. Create an Appetize account and an API token.
#   2. Repo → Settings → Secrets and variables → Actions:
#        secret   APPETIZE_API_TOKEN
#   3. After the first run, copy the printed publicKey into a repo *variable*
#      APPETIZE_PUBLIC_KEY_ANDROID so later runs update the same app (same URL).
#
# If the app has no android/ folder (common for an app written in a chat), the
# job generates one with `flutter create --platforms=android` for this build
# only; nothing is committed back.
name: Flutter Android Preview

on:
  push:
    branches: ["@@DEFAULT_BRANCH@@"]
    paths-ignore: ["**/*.md", "docs/**", ".idp.env"]
  workflow_dispatch:

concurrency:
  group: flutter-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    name: Debug APK → browser preview
    runs-on: ubuntu-latest
    timeout-minutes: @@TIMEOUT@@
    defaults:
      run:
        working-directory: @@APP_DIR@@
    env:
      APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
      APPETIZE_PUBLIC_KEY: ${{ vars.APPETIZE_PUBLIC_KEY_ANDROID }}
    steps:
      - uses: actions/checkout@@@CHECKOUT_VERSION@@
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate android/ if missing
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            echo "::notice::No android/ project; generating one for this build."
            flutter create --platforms=android --org @@ORG@@ .
          fi

      - run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@@@UPLOAD_ARTIFACT_VERSION@@
        with:
          name: android-debug-${{ github.run_number }}
          path: @@APP_DIR@@/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Upload to Appetize
        if: env.APPETIZE_API_TOKEN != ''
        run: |
          url="https://api.appetize.io/v1/apps${APPETIZE_PUBLIC_KEY:+/$APPETIZE_PUBLIC_KEY}"
          resp=$(curl -sS --fail-with-body -X POST "$url" \
            -H "X-API-KEY: $APPETIZE_API_TOKEN" \
            -F "file=@build/app/outputs/flutter-apk/app-debug.apk" \
            -F "platform=android" \
            -F "note=${GITHUB_REF_NAME} ${GITHUB_SHA::7}")
          key=$(printf '%s' "$resp" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("publicKey",""))')
          link=$(printf '%s' "$resp" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("publicURL") or "https://appetize.io/app/" + d.get("publicKey",""))')
          {
            echo "## ▶️ [Open the Android app in your browser]($link)"
            echo ""
            echo "Commit \`${GITHUB_SHA::7}\` on \`${GITHUB_REF_NAME}\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Browser preview::$link"
          if [ -z "$APPETIZE_PUBLIC_KEY" ] && [ -n "$key" ]; then
            echo "::warning title=Save the Appetize key::Add a repo variable APPETIZE_PUBLIC_KEY_ANDROID=$key so the next run updates this app instead of creating a new one."
          fi

      - name: No Appetize token
        if: env.APPETIZE_API_TOKEN == ''
        run: |
          echo "Debug APK attached as an artifact (install it on an Android phone). Add the APPETIZE_API_TOKEN secret to get a browser link." >> "$GITHUB_STEP_SUMMARY"
