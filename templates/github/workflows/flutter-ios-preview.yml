# Generated by mobile-idp scripts/generate-github-actions.sh — regenerate rather than hand-edit.
#
# Builds an unsigned debug iOS simulator Runner.app on macOS and attaches it,
# zipped, to the run. No Apple Developer account and no TestFlight needed; run
# it on any Mac with `xcrun simctl install booted Runner.app`.
#
# If the app has no ios/Runner.xcodeproj (common for an app written in a chat),
# the job generates one with `flutter create --platforms=ios` for this build
# only; nothing is committed back. macOS minutes count 10x on private repos.
name: Flutter iOS Preview

on:
  push:
    branches: ["@@DEFAULT_BRANCH@@"]
    paths-ignore: ["**/*.md", "docs/**", ".idp.env"]
  workflow_dispatch:

concurrency:
  group: flutter-ios-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    name: Simulator build → artifact
    runs-on: @@RUNNER@@
    timeout-minutes: @@TIMEOUT@@
    defaults:
      run:
        working-directory: @@APP_DIR@@
    steps:
      - uses: actions/checkout@@@CHECKOUT_VERSION@@
        with:
          submodules: recursive

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: @@XCODE_VERSION@@

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate ios/ if missing
        run: |
          if [ ! -d ios/Runner.xcodeproj ]; then
            echo "::notice::No ios/Runner.xcodeproj; generating the iOS project for this build."
            flutter create --platforms=ios --org @@ORG@@ .
          fi

      - run: flutter pub get

      - name: Build for simulator (unsigned, debug)
        run: flutter build ios --simulator --debug

      - name: Zip .app
        id: zip
        run: |
          app=$(find build/ios/iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          [ -n "$app" ] || { echo "::error::No .app produced"; exit 1; }
          ditto -c -k --sequesterRsrc --keepParent "$app" build/app-simulator.zip
          echo "path=build/app-simulator.zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@@@UPLOAD_ARTIFACT_VERSION@@
        with:
          name: ios-simulator-${{ github.run_number }}
          path: @@APP_DIR@@/build/app-simulator.zip
          retention-days: 14

      - name: Summary
        run: |
          echo "Simulator build attached as an artifact (app-simulator.zip)." >> "$GITHUB_STEP_SUMMARY"
