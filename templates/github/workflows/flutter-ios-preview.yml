# Generated by mobile-idp scripts/generate-github-actions.sh — regenerate rather than hand-edit.
#
# Builds an unsigned debug iOS simulator Runner.app on macOS and, if
# APPETIZE_API_TOKEN is set, uploads it to Appetize so the app runs in a web
# browser — desktop or iPhone — with no Mac, no Apple Developer account and no
# TestFlight.
#
# Setup (once):
#   1. Create an Appetize account and an API token.
#   2. Repo → Settings → Secrets and variables → Actions:
#        secret   APPETIZE_API_TOKEN
#   3. After the first run, copy the printed publicKey into a repo *variable*
#      APPETIZE_PUBLIC_KEY_IOS so later runs update the same app (same URL).
#
# If the app has no ios/Runner.xcodeproj (common for an app written in a chat),
# the job generates one with `flutter create --platforms=ios` for this build
# only; nothing is committed back. macOS minutes count 10x on private repos.
name: Flutter iOS Preview

on:
  push:
    branches: ["@@DEFAULT_BRANCH@@"]
    paths-ignore: ["**/*.md", "docs/**", ".idp.env"]
  workflow_dispatch:

concurrency:
  group: flutter-ios-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    name: Simulator build → browser preview
    runs-on: @@RUNNER@@
    timeout-minutes: @@TIMEOUT@@
    defaults:
      run:
        working-directory: @@APP_DIR@@
    env:
      APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
      APPETIZE_PUBLIC_KEY: ${{ vars.APPETIZE_PUBLIC_KEY_IOS }}
    steps:
      - uses: actions/checkout@@@CHECKOUT_VERSION@@
        with:
          submodules: recursive

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: @@XCODE_VERSION@@

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate ios/ if missing
        run: |
          if [ ! -d ios/Runner.xcodeproj ]; then
            echo "::notice::No ios/Runner.xcodeproj; generating the iOS project for this build."
            flutter create --platforms=ios --org @@ORG@@ .
          fi

      - run: flutter pub get

      - name: Build for simulator (unsigned, debug)
        run: flutter build ios --simulator --debug

      - name: Zip .app
        id: zip
        run: |
          app=$(find build/ios/iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          [ -n "$app" ] || { echo "::error::No .app produced"; exit 1; }
          ditto -c -k --sequesterRsrc --keepParent "$app" build/app-simulator.zip
          echo "path=build/app-simulator.zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@@@UPLOAD_ARTIFACT_VERSION@@
        with:
          name: ios-simulator-${{ github.run_number }}
          path: @@APP_DIR@@/build/app-simulator.zip
          retention-days: 14

      - name: Upload to Appetize
        if: env.APPETIZE_API_TOKEN != ''
        run: |
          url="https://api.appetize.io/v1/apps${APPETIZE_PUBLIC_KEY:+/$APPETIZE_PUBLIC_KEY}"
          resp=$(curl -sS --fail-with-body -X POST "$url" \
            -H "X-API-KEY: $APPETIZE_API_TOKEN" \
            -F "file=@${{ steps.zip.outputs.path }}" \
            -F "platform=ios" \
            -F "note=${GITHUB_REF_NAME} ${GITHUB_SHA::7}")
          key=$(printf '%s' "$resp" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("publicKey",""))')
          link=$(printf '%s' "$resp" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("publicURL") or "https://appetize.io/app/" + d.get("publicKey",""))')
          {
            echo "## ▶️ [Open the iOS app in your browser]($link)"
            echo ""
            echo "Commit \`${GITHUB_SHA::7}\` on \`${GITHUB_REF_NAME}\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Browser preview::$link"
          if [ -z "$APPETIZE_PUBLIC_KEY" ] && [ -n "$key" ]; then
            echo "::warning title=Save the Appetize key::Add a repo variable APPETIZE_PUBLIC_KEY_IOS=$key so the next run updates this app instead of creating a new one."
          fi

      - name: No Appetize token
        if: env.APPETIZE_API_TOKEN == ''
        run: |
          echo "Simulator build attached as an artifact. Add the APPETIZE_API_TOKEN secret to get a browser link." >> "$GITHUB_STEP_SUMMARY"
